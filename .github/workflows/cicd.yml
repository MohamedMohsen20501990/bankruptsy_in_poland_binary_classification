name: cicd_bankruptsy_poland

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code from repo 
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        run: pytest
  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6  
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bankruptsy-api:latest
            ${{ secrets.DOCKER_USERNAME }}/bankruptsy-api:${{ github.sha }}
      
      - name: image digest
        run: echo "${{ steps.docker-build.outputs.digest }}"


  deploy-to-ec2:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/bankruptsy-api:${{ github.sha }}

            docker stop bankruptsy-api || true
            docker rm bankruptsy-api || true

            docker run -d \
              --name bankruptsy-api \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/bankruptsy-api:${{ github.sha }}
